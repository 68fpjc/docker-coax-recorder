port: 8888

dbtype: mysql
mysql:
  host: mysql
  port: 3306
  user: epgstation
  password: !env MYSQL_PASSWORD
  database: epgstation
  charset: utf8mb4

recordedFileExtension: .m2ts
recorded:
  - name: recorded
    path: '%ROOT%/recorded'

ffmpeg: /usr/bin/ffmpeg
ffprobe: /usr/bin/ffprobe

recordingFinishCommand: '/bin/sh %ROOT%/config/recording-finish.sh'

encodeProcessNum: 4
concurrentEncodeNum: 1
encode:
  - name: H.264
    cmd: '%NODE% %ROOT%/config/enc.js'
    suffix: .mp4
    rate: 4.0

isEnabledDropCheck: true
